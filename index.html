<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whirr</title>
<style>
:root{--bg:#fdfdfc;--fg:#1a1a19;--muted:#5f5f5b;--rule:#e3e3df;--accent:#3a6b5f}
@media (prefers-color-scheme:dark){:root{--bg:#16181a;--fg:#e8e8e4;--muted:#a0a099;--rule:#2c2f32;--accent:#7fbfae}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);
font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
display:flex;align-items:center;min-height:100vh;padding:3rem 1.25rem}
main{max-width:34rem;margin:0 auto}
h1{font-size:2.2rem;margin:0 0 .4rem}
p{font-size:1.05rem}
.muted{color:var(--muted);font-size:.95rem}
nav{margin-top:2rem;padding-top:1.3rem;border-top:1px solid var(--rule)}
nav a{color:var(--accent);margin-right:1.5rem}
</style>
</head>
<body>
<main>
<h1>Whirr</h1>
<p>An iOS client for <a href="https://www.audiobookshelf.org">Audiobookshelf</a> — audiobooks,
podcasts, and EPUBs from a server you run yourself.</p>
<p class="muted">Whirr has no server of its own and collects no data about you.</p>
<nav>
<a href="support.html">Support</a>
<a href="privacy.html">Privacy</a>
</nav>
</main>
</body>
</html>
